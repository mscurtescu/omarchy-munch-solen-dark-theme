# Munch Solen — sampled from the UiO Aula TIFF of Edvard Munch, *The Sun*.
#
# The mural is the light. Chrome is the rock shadow: cool indigo clefts,
# cadmium rays for focus, straw halo for type. Roles follow the study map;
# hexes are from this scan, not the yellow-house JPEG.
#
# Semantic names are the source of truth. Compact aliases and color0–color15
# mirror them for templates and older integrations.
